---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gcl-config
  namespace: governed-cognitive-loop
data:
  GCL_FORCE_DETERMINISTIC: "1"
  GCL_CORS_ORIGINS: "*"
  GCL_RUNTIME_MODE: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcl-app
  namespace: governed-cognitive-loop
  labels:
    app: gcl-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gcl-app
  template:
    metadata:
      labels:
        app: gcl-app
    spec:
      containers:
        - name: gcl-app
          image: image-registry.openshift-image-registry.svc:5000/governed-cognitive-loop/gcl-app:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: gcl-config
          env:
            - name: GCL_LEDGER_URL
              value: "http://ledger-gateway.immutable-ledger.svc:28099"
            - name: GCL_LEDGER_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gcl-identity
                  key: ledger-token
            - name: GCL_DECISION_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: gcl-decision-signing
                  key: active-key
            - name: GCL_DECISION_SIGNING_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: gcl-decision-signing
                  key: active-key-id
            - name: GCL_DEEPFIELD_EVENT_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gcl-identity
                  key: deepfield-event-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gcl-app
  namespace: governed-cognitive-loop
spec:
  selector:
    app: gcl-app
  ports:
    - port: 8000
      targetPort: 8000
      name: http
