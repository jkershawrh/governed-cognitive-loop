[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-cognitive-loop"
version = "0.1.0"
description = "LLM-MPC with evidence-based constraint classification and hypothesis falsification before commit"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "eval-type-backport>=0.4.0; python_version < '3.10'",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "uvicorn>=0.29.0",
    "pyyaml>=6.0",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["gcl*"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
ignore = [
    "E501",   # line-too-long — existing codebase style
    "UP006",  # non-pep585-annotation — Optional[], List[] ok for 3.9 compat
    "UP035",  # deprecated-import — typing imports ok for 3.9 compat
    "UP037",  # quoted-annotation — forward refs in pydantic models
    "UP045",  # non-pep604-annotation-optional — Optional[] ok for 3.9 compat
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F841", "E741", "F821"]
